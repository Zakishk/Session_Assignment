name: API Test – Playwright

on:
  workflow_dispatch:   # Run only when manually triggered

jobs:
  run-api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: Ecare-api-testing-framework

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: Ecare-api-testing-framework

      - name: Run API Tests and Generate Report
        run: |
          npx playwright test tests/clinician-management.spec.js --reporter=html
        working-directory: Ecare-api-testing-framework

      - name: Archive Playwright HTML Report
        run: |
          zip -r html-report.zip ./playwright-report
        working-directory: Ecare-api-testing-framework

      - name: Send Email Notification with Report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Playwright API Test Results – ${{ job.status }}
          body: |
            <html>
              <body>
                <h2>Playwright API Test Execution Summary</h2>
                <p>Status: <strong>${{ job.status }}</strong></p>
                <p>Branch: <code>${{ github.ref_name }}</code></p>
                <p>Commit: <code>${{ github.sha }}</code></p>
                <p>Run ID: <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View Workflow Run</a></p>
                <p>Attached is the HTML report generated by Playwright.</p>
                <br>
                <p>Regards,<br>Ecare QA Automation</p>
              </body>
            </html>
          to: himanshu.bhoi@thinkitive.com
          from: QA Bot <your.email@example.com>
          content_type: text/html
          attachments: Ecare-api-testing-framework/html-report.zip
