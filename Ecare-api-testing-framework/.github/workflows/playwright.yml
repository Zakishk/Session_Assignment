name: API Test – Playwright

on:
  push:
    branches:
      - local  # make sure this matches your actual branch name

jobs:
  run-api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install
        working-directory: Ecare-api-testing-framework

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: Ecare-api-testing-framework

      - name: Run API Tests
        run: npx playwright test tests/clinician-management.spec.js 
        working-directory: Ecare-api-testing-framework
